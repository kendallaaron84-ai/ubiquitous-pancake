name: KOBA-I release gate

on:
  pull_request:
  push:
    branches:
      - "codex/**"
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: koba-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    name: Dashboard build and regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm run test:nexus
      - run: pnpm run test:security
      - run: pnpm run build

  firestore-rules:
    name: Firestore tenant-isolation rules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: pnpm install --frozen-lockfile
      - run: pnpm dlx firebase-tools@14.18.0 emulators:exec --only firestore --project author-jubilee-command-center-rules-test "node --test core/security/rules-tests/firestore-nexus-rules.test.mjs"

  wordpress-gateway:
    name: WordPress gateway
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/wordpress-egress-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: services/wordpress-egress-gateway/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: node --test credential-reference.test.mjs
